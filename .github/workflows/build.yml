name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Unpack project if it was uploaded as a zip
        run: |
          if [ -f goatstalker-mod.zip ]; then
            unzip -q -o goatstalker-mod.zip
            cp -a goatstalker/. .
          fi
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: goatstalker-jar
          path: build/libs/*.jar
